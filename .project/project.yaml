name: "Alamia Accounts"
version: "1.0.0"
status: "active"
description: "Institutional Double-Entry Accounting Software with Multi-Tenant Isolation & Frontline POS Gateway"
created_at: "2026-09-02"
updated_at: "2026-10-07"

accounting_invariants:
  - "Double-Entry Balance: sum(Debits) === sum(Credits)"
  - "Historical Immutability: Posted vouchers must never be deleted (compensating REV- only)"
  - "Posting Separation: Transactions post strictly to leaf accounts (category: false)"
  - "Domain Isolation: Transactions strictly partitioned by company domain"

