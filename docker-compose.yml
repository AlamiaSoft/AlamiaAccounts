services:
  backend:
    build:
      context: ./AlamiaAccounts-Backend
      dockerfile: Dockerfile
    container_name: alamia-accounts-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Alamia Accounts
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    volumes:
      - ./AlamiaAccounts-Backend:/var/www
      - backend_vendor:/var/www/vendor
      - ./AlamiaAccounts-Backend/database:/var/www/database
      - ./AlamiaAccounts-Backend/storage:/var/www/storage
    networks:
      - alamia-network

  frontend:
    build:
      context: ./AlamiaAccounts-Frontend
      dockerfile: Dockerfile.dev
    container_name: alamia-accounts-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_APP_NAME=Alamia Accounts
      - WATCHPACK_POLLING=true
    volumes:
      - ./AlamiaAccounts-Frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - alamia-network

networks:
  alamia-network:
    driver: bridge

volumes:
  backend_vendor:
  frontend_node_modules:
